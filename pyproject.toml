[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exoplanet-transit-classifier"
version = "0.1.0"
description = "Classify TESS light curves as likely exoplanet transit candidates."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "astropy",
    "lightkurve",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
